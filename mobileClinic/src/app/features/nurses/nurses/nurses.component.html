<div class="page">

  <div class="page-header">
    <div>
      <h1>Nurses</h1>
      <p>Manage nursing staff and duty schedules.</p>
    </div>

    <button class="primary-button">
      <span class="material-icons">person_add</span>
      Add Nurse
    </button>
  </div>

  <div class="stats-grid">

    <div class="stat-card">
      <div class="stat-icon">
        <span class="material-icons">local_hospital</span>
      </div>
      <div>
        <span>Total Nurses</span>
        <strong>38</strong>
      </div>
    </div>

    <div class="stat-card">
      <div class="stat-icon">
        <span class="material-icons">verified</span>
      </div>
      <div>
        <span>On Duty</span>
        <strong>27</strong>
      </div>
    </div>

    <div class="stat-card">
      <div class="stat-icon">
        <span class="material-icons">schedule</span>
      </div>
      <div>
        <span>Shifts Today</span>
        <strong>12</strong>
      </div>
    </div>

  </div>

  <div class="card">

    <div class="toolbar">

      <div class="search-box">
        <span class="material-icons">search</span>

        <input
          [(ngModel)]="searchTerm"
          placeholder="Search nurses...">

      </div>

    </div>

    <div class="table-wrapper">

      <table>

        <thead>
          <tr>
            <th>Nurse</th>
            <th>Department</th>
            <th>Phone</th>
            <th>Shift</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>

        <tbody>

          <tr *ngFor="let nurse of filteredNurses">

            <td class="patient-name">
              <div class="avatar">
                {{ nurse.name.charAt(6) }}
              </div>
              {{ nurse.name }}
            </td>

            <td>{{ nurse.department }}</td>
            <td>{{ nurse.phone }}</td>
            <td>{{ nurse.shift }}</td>

            <td>
              <span
                class="status"
                [class.off-duty]="nurse.status === 'Off Duty'">
                {{ nurse.status }}
              </span>
            </td>

            <td>
              <button class="icon-button">
                <span class="material-icons">more_vert</span>
              </button>
            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>
