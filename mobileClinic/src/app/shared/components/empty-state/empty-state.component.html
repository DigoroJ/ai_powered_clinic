
<div class="empty-state-container" [ngClass]="'variant-' + variant">

  <span class="material-icons empty-state-icon">
    {{ icon }}
  </span>

  <h3>{{ title }}</h3>

  <p>{{ message }}</p>

  <button
    *ngIf="actionLabel"
    type="button"
    class="empty-state-action"
    (click)="onAction()">
    {{ actionLabel }}
  </button>

</div>
